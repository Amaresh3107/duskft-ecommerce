name: Deploy Antigravity Wholesale

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}          # CHANGE: set in repo Settings > Secrets > Actions (your EC2 public IP)
          username: ${{ secrets.EC2_USERNAME }}  # CHANGE: usually "ubuntu"
          key: ${{ secrets.EC2_SSH_KEY }}        # CHANGE: paste full contents of your .pem private key
          script: |
            set -e
            cd ~/duskft/duskft-ecommerce        # CHANGE: update if your repo path on the instance is different
            git pull origin main
            docker compose up --build -d
            sleep 10
            curl -f http://localhost:8000/docs   # fails the workflow if backend didn't come up
            docker image prune -f
